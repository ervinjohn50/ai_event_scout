[project]
name = "event-scout"
version = "0.1.0"
description = "A concert and event scout agent built on a custom Claude tool-use loop."
readme = "README.md"
authors = [
    { name = "ervinjohn50", email = "71913788+ervinjohn50@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0",
    "pydantic>=2.14.2",
]

[project.scripts]
event-scout = "event_scout.cli:main"
event-scout-eval = "event_scout.evals:main"

[project.optional-dependencies]
langchain = [
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langgraph>=1.2.19",
    "langsmith>=0.14.17",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langgraph>=1.2.19",
    "langsmith>=0.14.17",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
